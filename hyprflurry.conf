# hyprflurry example config
# copy to ~/.config/hypr/hyprflurry.conf; changes apply as soon as you save

# number of flakes per 1920x1080 of screen area
flakes = 300

# frame rate cap; 0 follows the monitor's refresh rate
fps = 0

# fall speed multiplier
speed = 1.0

# horizontal drift: negative blows left, 1.0 = 45 degrees
wind = 0.15

# how much the wind gusts around its base value
gust = 0.25

# side-to-side wobble multiplier (0 = straight down)
sway = 1.0

# flake radius in pixels, for the farthest and nearest flakes
min_size = 1.0
max_size = 4.5

opacity = 0.9
color = rgba(ffffffff)

# soft | crystal | mixed
style = mixed

# bottom: above the wallpaper, below windows (recommended)
# background: same layer as the wallpaper (may end up hidden behind it)
layer = bottom

# comma separated monitor names (see `hyprctl monitors`); empty = all monitors
monitors =

# --- piling ---

# snow piles up at the bottom of the screen
pile = true

# ... and on top of windows (moving or closing a window shakes its snow off)
pile_windows = true

# maximum pile height in pixels, at the bottom and on windows
pile_max = 40
pile_window_max = 12

# how fast piles grow, and how fast they melt (pixels per second)
pile_rate = 1.0
pile_melt = 0.05
